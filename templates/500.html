<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error | Nurseon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-800">
    <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <p class="text-sm font-bold uppercase tracking-wider text-red-700">Error 500</p>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">Something went wrong</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">
            An unexpected server error occurred while processing your request. No data was corrupted—please try again or
            return to your dashboard.
        </p>
        <div class="mt-6 flex justify-center">
            <a href="/dashboard/"
                class="rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-teal-800">
                Return to Dashboard
            </a>
        </div>
    </main>
</body>

</html>
