<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nurseon – AI Nursing Reviewer{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        nurseon: {
                            DEFAULT: '#14967f',
                            dark: '#095d7e',
                            darker: '#095d7e',
                            light: '#ccecee',
                            mint: '#e2fcd6',
                            surface: '#f1f9ff',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .pwd-toggle { cursor: pointer; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="font-sans min-h-screen {% block body_class %}bg-nurseon-surface text-slate-800{% endblock %}">
    {% block layout %}{% endblock layout %}
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
