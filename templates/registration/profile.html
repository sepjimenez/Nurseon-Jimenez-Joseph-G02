{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border border-slate-200 mt-8">
    <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Update User Profile</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition duration-200">
            Save Profile Changes
        </button>
    </form>
</div>
{% endblock %}
