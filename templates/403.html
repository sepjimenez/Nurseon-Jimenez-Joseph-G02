{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 – Forbidden | Nurseon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-50 px-4 text-slate-800">
    <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm">
        <p class="text-sm font-bold uppercase tracking-wider text-teal-700">Error 403</p>
        <h1 class="mt-2 text-2xl font-bold text-slate-900">Access denied</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">
            You do not have permission to perform this action.
        </p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
            <a href="/dashboard/"
                class="rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-teal-800">
                Go to Dashboard
            </a>
            <a href="/documents/"
                class="rounded-xl border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
                Browse Documents
            </a>
        </div>
    </main>
</body>

</html>
